name: MCPuzzle
version: 0.1.0-SNAPSHOT
main: dev.mcpuzzle.paper.MCPuzzlePlugin
api-version: '1.20'
load: POSTWORLD
description: Party-based puzzle maze engine for Paper 1.20.1
authors: [MCPuzzle]

commands:
  maze:
    description: MCPuzzle main command
    usage: /maze [party|accept|deny|start|queue|saves|resume|leave|delete|hint|leaderboard|answer|status|admin]
    aliases: [미궁]
    permission: mcpuzzle.use

permissions:
  mcpuzzle.use:
    description: Allows use of player-facing MCPuzzle commands
    default: true
  mcpuzzle.spectate:
    description: Allows hidden, non-interactive maze spectating
    default: op
  mcpuzzle.admin:
    description: Allows MCPuzzle administration
    default: op
