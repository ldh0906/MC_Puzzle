locale: ko_KR

instances:
  max-active-worlds: 2
  afk-timeout-minutes: 10

containment:
  # 공용 서버에서도 OP가 실수로 다른 인스턴스에 개입하지 않도록 기본값은 false입니다.
  operator-bypass: false
  allowed-commands:
    - maze
    - 미궁

lobby:
  world: world

resource-pack:
  # true인 경우 아래 URL과 SHA-1이 유효하고 플레이어가 로드를 완료해야 입장할 수 있습니다.
  required: true
  url: 'http://127.0.0.1:8123/MCPuzzle-1.0.0.zip'
  sha1: '2b56e1cf36b1c19b54b64e7953bb3c82411ab971'
  # 현재 PC에서 혼자 테스트하는 설정입니다. 외부 플레이어에게 공개할 때는 false로 끄고
  # HTTPS 배포 URL을 사용하거나, bind-address와 URL 호스트를 실제 서버 주소로 바꾸세요.
  local-host:
    enabled: true
    bind-address: '127.0.0.1'
    port: 8123
    file: 'resource-pack/MCPuzzle-1.0.0.zip'
